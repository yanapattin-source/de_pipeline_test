services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: sensor_db
      POSTGRES_USER: pipeline
      POSTGRES_PASSWORD: pipeline123
    command: >
      -c max_wal_size=4GB
      -c checkpoint_timeout=15min
      -c wal_buffers=64MB
      -c maintenance_work_mem=512MB
      -c max_worker_processes=16
      -c max_parallel_workers=8
      -c shared_buffers=512MB
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipeline -d sensor_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  mage:
    build:
      context: .
      args:
        MAGEAI_VERSION: ${MAGEAI_VERSION:-0.9.79}
    environment:
      USER_CODE_PATH: /home/src/sensor_pipeline
      ENV: dev
      # Local dev default: no login required. If changed to "1", use the owner credentials below.
      REQUIRE_USER_AUTHENTICATION: "0"
      DEFAULT_OWNER_EMAIL: "admin@admin.com"
      DEFAULT_OWNER_PASSWORD: "admin"
      DEFAULT_OWNER_USERNAME: "admin"
      MAGE_DATABASE_CONNECTION_URL: postgresql+psycopg2://pipeline:pipeline123@postgres:5432/sensor_db
      SCHEMA_SQL_PATH: /home/src/schema.sql
      DATA_DIR: /home/src/data_sample
    ports:
      - "6789:6789"
    volumes:
      - ./mage:/home/src
      - ./data_sample:/home/src/data_sample:ro
      - ./schema.sql:/home/src/schema.sql:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: ["mage", "start", "sensor_pipeline"]
    restart: on-failure:5

volumes:
  pgdata:
